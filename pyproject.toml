[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zepto-core-domain-types"
version = "0.1.0"
description = "Backend-neutral structural graph types for Zepto"
requires-python = ">=3.11"

[project.optional-dependencies]
empirical = [
    "torch",
    "transformers",
]

[project.scripts]
zepto-bench = "zepto.benchmark.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: slow wall-clock simulation benchmarks (opt-in with -m benchmark)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zepto.empirical" = ["methodology_template.md"]
